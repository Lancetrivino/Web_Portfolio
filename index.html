<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a0a0f" />

    <!-- Favicon (uses your existing logo in /public) -->
    <link rel="icon" type="image/png" href="/ALT_Logo.png" />
    <link rel="apple-touch-icon" href="/ALT_Logo.png" />

    <!-- Primary meta -->
    <title>Andrei Lance Triviño — Frontend Developer</title>
    <meta
      name="description"
      content="Frontend developer building fast, accessible, and beautiful web experiences with React. See my projects, skills, and certifications."
    />
    <meta name="author" content="Andrei Lance Triviño" />

    <!-- Open Graph (Facebook, Messenger, LinkedIn, Discord) -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://YOUR-DOMAIN.vercel.app/" />
    <meta property="og:title" content="Andrei Lance Triviño — Frontend Developer" />
    <meta
      property="og:description"
      content="Frontend developer building fast, accessible, and beautiful web experiences with React."
    />
    <meta property="og:image" content="https://YOUR-DOMAIN.vercel.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Andrei Lance Triviño — Frontend Developer" />
    <meta
      name="twitter:description"
      content="Frontend developer building fast, accessible, and beautiful web experiences with React."
    />
    <meta name="twitter:image" content="https://YOUR-DOMAIN.vercel.app/og-image.png" />

    <!-- Fonts: Inter + Fira Code (matches your CSS variables) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fira+Code:wght@400;500&display=swap"
      rel="stylesheet"
    />

    <!-- Tabler Icons webfont (renders your `ti ti-*` icons) -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.44.0/dist/tabler-icons.min.css"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
